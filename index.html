<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>The Emberkeep</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23100d0b'/%3E%3Cpath d='M90 34c14 20 34 32 34 56a34 34 0 0 1-68 0c0-9 3-17 8-23a19 19 0 0 0 19 19 19 19 0 0 0 19-19c0-11-6-16-12-33z' fill='%23e8933c'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#100d0b; --card:#1b1613; --card2:#251d18; --line:rgba(255,232,205,.07);
  --brass:#e8933c; --pine:#f0c04a; --violet:#c2472b;
  --text:#f6ebdd; --dim:#ab9c8a; --faint:#7d6d5b; --danger:#d2503a;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(120% 55% at 50% -10%,rgba(232,147,60,.10) 0%,rgba(194,71,43,.045) 38%,transparent 72%);
  background-attachment:fixed;background-repeat:no-repeat;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input{font:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}

/* type */
h1{font-size:23px;font-weight:900;letter-spacing:-.025em;text-transform:uppercase;
  background:linear-gradient(94deg,#f4b73f 0%,#e8933c 42%,#c2472b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent}
h1 .the{font-weight:500;font-size:.6em;letter-spacing:.08em;margin-right:.2em;vertical-align:.14em;
  -webkit-text-fill-color:var(--faint);color:var(--faint)}
h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
h3{font-size:15px;font-weight:700}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.xs{font-size:12px}
.s{font-size:13px}

/* layout */
header{padding:calc(18px + env(safe-area-inset-top)) 0 16px;display:flex;
  align-items:flex-end;justify-content:space-between;gap:12px}
main{display:flex;flex-direction:column;gap:10px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 9px}
.pad{padding:16px}
.pt0{padding-top:0}
.divide>*+*{border-top:1px solid var(--line)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* hero */
.hero{padding:18px 16px}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pill{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.03em}
.hero-name{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.hero-sub{font-size:13px;color:var(--dim);margin-top:2px}
.cycle{display:flex;align-items:center;gap:6px;margin-top:16px}
.cycle .st{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:12px;
  font-weight:800;background:var(--card2);color:var(--faint)}
.cycle .ar{color:var(--faint);font-size:11px}
.meta{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--dim)}
.meta b{color:var(--text)}

/* tier picker */
.tiers{display:flex;gap:8px;padding:0 16px 16px}
.tiers button{flex:1;min-height:60px;border-radius:11px;background:var(--card2);
  border:1px solid transparent;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;transition:all .15s}
.tiers button.on{background:rgba(232,147,60,.13);border-color:var(--brass);color:var(--brass)}
.tiers b{font-size:13px;font-weight:800}
.tiers span{font-size:10px;opacity:.8}

/* progress */
.prog{height:4px;background:var(--card2);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px;transition:width .3s ease}

/* exercise rows */
.ex{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;min-height:60px}
.tick{display:flex;align-items:center;gap:13px;flex:1;min-width:0;min-height:60px}
.box{width:23px;height:23px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;border:1.5px solid rgba(255,232,205,.15);transition:all .15s}
.box svg{width:13px;height:13px}
.exn{flex:1;min-width:0}
.exn .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exn .m{font-size:11.5px;color:var(--faint);margin-top:1px;letter-spacing:.02em}
.ex.done .t{color:var(--faint);text-decoration:line-through}
.ex.off{opacity:.4}
.wbtn{flex:0 0 auto;min-width:60px;min-height:42px;border-radius:10px;background:var(--card2);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1.05;padding:0 9px;transition:all .15s}
.wbtn .v{font-size:16px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.wbtn .u{font-size:8.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.wbtn.unset .v{font-size:11px;font-weight:700;color:var(--faint)}

/* weight editor */
.wed{display:flex;gap:5px;align-items:center;padding:2px 12px 14px 16px}
.wed .st{flex:1;min-width:0;min-height:42px;border-radius:9px;background:var(--card2);
  border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--dim);
  display:flex;align-items:center;justify-content:center}
.wed input{width:64px;flex:0 0 auto;min-height:42px;border-radius:9px;background:var(--bg);
  border:1px solid var(--line);color:var(--text);font-size:16px;font-weight:800;
  text-align:center;font-family:ui-monospace,Menlo,monospace}
.wed .ok{flex:0 0 auto;min-height:42px;padding:0 13px;border-radius:9px;color:#100d0b;
  font-size:12.5px;font-weight:800;display:flex;align-items:center}

/* buttons */
.btn{width:100%;min-height:52px;border-radius:12px;font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--card2);color:var(--dim);transition:all .2s}
.btn.go{background:var(--brass);color:#100d0b}
.btn.ok{background:var(--pine);color:#100d0b}
.btn.ghost{min-height:46px;font-size:13px;font-weight:600;background:transparent;
  border:1px solid var(--line);color:var(--faint)}
.btn svg{width:17px;height:17px}

/* generic rows */
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;min-height:52px}
.r .l{flex:1;min-width:0}
.r .v{flex:0 0 auto;font-size:13px;color:var(--dim)}
.tagr{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;
  background:var(--card2);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.tagr.new{background:rgba(232,147,60,.14);color:var(--brass)}

/* stat cards */
.stat{padding:15px 16px}
.stat .k{display:flex;align-items:center;gap:6px;color:var(--faint);margin-bottom:7px}
.stat .k svg{width:13px;height:13px}
.stat .n{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1}
.stat .n em{font-size:11px;font-weight:500;font-style:normal;color:var(--faint);margin-left:3px}
.stat .d{font-size:11px;margin-top:4px}

/* accordion */
.acc{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:15px 16px;min-height:58px;gap:12px}
.acc .lft{display:flex;align-items:center;gap:12px;min-width:0}
.ic{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center}
.ic svg{width:16px;height:16px}
.chev{width:16px;height:16px;color:var(--faint);flex:0 0 auto;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.body{padding:0 16px 16px}
.tip+.tip{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.tip h3{color:var(--pine);margin-bottom:3px}
.tip p{font-size:13.5px;color:var(--dim);line-height:1.55}
.tip.key h3{color:var(--brass)}
.tip strong{color:var(--text);font-weight:600}

/* chart */
.chart{position:relative;height:190px;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.tip-c{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px;font-size:12px;white-space:nowrap;
  transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.tip-c.on{opacity:1}
.tip-c b{color:var(--brass)}
.segs{display:flex;gap:5px;padding:0 16px 12px}
.segs button{flex:1;min-height:33px;border-radius:8px;font-size:12px;font-weight:800;
  background:var(--card2);color:var(--faint);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center}
.segs button.on{background:rgba(232,147,60,.13);color:var(--brass);border-color:var(--brass)}
.mini{display:flex;gap:14px;padding:0 16px 10px;font-size:11.5px;color:var(--faint)}
.mini b{font-weight:800}
.scroll{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* food + water */
.wrow{display:flex;gap:6px;margin-top:12px}
.wq{flex:1;min-height:44px;border-radius:10px;background:rgba(147,174,184,.12);
  border:1px solid rgba(147,174,184,.28);color:#b0cad3;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.wq.neg{background:var(--card2);border-color:var(--line);color:var(--faint);flex:0 0 54px}
.wq.cup{flex-direction:column;gap:1px;min-height:52px;line-height:1.1}
.wq .cn{font-size:11px;font-weight:800;letter-spacing:.02em}
.wq .co{font-size:12.5px;font-weight:700;opacity:.75}
.cuphead{display:flex;align-items:center;justify-content:space-between;margin-top:16px;margin-bottom:7px}
.icetog{min-height:30px;padding:0 11px;border-radius:999px;font-size:11px;font-weight:800;
  background:var(--card2);border:1px solid var(--line);color:var(--faint);
  display:flex;align-items:center}
.icetog.on{background:rgba(147,174,184,.14);border-color:rgba(147,174,184,.4);color:#b0cad3}
.del{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--card2);
  color:var(--faint);display:flex;align-items:center;justify-content:center}
.del svg{width:14px;height:14px}
.qa{width:100%;min-height:56px}
.addico{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:rgba(232,147,60,.14);
  color:var(--brass);display:flex;align-items:center;justify-content:center}
.addico svg{width:15px;height:15px}
.fin{min-height:48px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
  color:var(--text);font-size:16px;padding:0 12px}

/* food search */
.srch{position:relative;display:flex;align-items:center}
.srch input{width:100%;min-height:50px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line);color:var(--text);font-size:16px;padding:0 40px}
.srch input:focus{border-color:rgba(232,147,60,.5);outline:none}
.sico{position:absolute;left:13px;width:16px;height:16px;color:var(--faint);
  pointer-events:none;display:block}
.clr{position:absolute;right:8px;width:32px;height:32px;border-radius:8px;color:var(--faint);
  display:flex;align-items:center;justify-content:center}
.clr svg{width:14px;height:14px}
.reclist{margin-top:6px}
.fres{padding:11px 0;border-top:1px solid var(--line)}
.fres:first-child{border-top:none}
.fr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fr-n{font-size:14.5px;font-weight:600;line-height:1.25}
.fr-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.fr-m{font-size:11.5px;color:var(--faint)}
.fr-act{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.sv{width:32px;height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
  color:var(--dim);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.svn{width:26px;text-align:center;font-size:13px;font-weight:800;color:var(--text)}
.fadd{width:38px;height:34px;border-radius:8px;background:var(--brass);color:var(--bg);
  display:flex;align-items:center;justify-content:center;margin-left:3px}
.fadd svg{width:15px;height:15px}

/* calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px}
.mnav{width:40px;height:40px;border-radius:10px;background:var(--card2);color:var(--dim);
  display:flex;align-items:center;justify-content:center}
.mnav svg{width:17px;height:17px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 4px}
.dow span{text-align:center;font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 10px}
.cell{aspect-ratio:1/1;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:transparent;
  border:1px solid transparent;min-height:40px;padding:0}
.cell.empty{visibility:hidden}
.cell .dn{font-size:13px;font-weight:600;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
.cell.today{background:var(--card2);border-color:rgba(232,147,60,.35)}
.cell.today .dn{color:var(--brass);font-weight:800}
.cell.sel{border-color:var(--brass);background:rgba(232,147,60,.1)}
.marks{display:flex;gap:2.5px;height:5px;align-items:center}
.marks i{display:block;border-radius:999px}
.marks .wk{width:5px;height:5px}
.marks .fd{width:5px;height:5px;background:var(--pine)}
.marks .wt{width:5px;height:5px;background:#93aeb8}
.legend{display:flex;gap:14px;padding:0 14px 14px;font-size:10.5px;color:var(--faint);
  border-top:1px solid var(--line);padding-top:11px;margin-top:2px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:5px;height:5px;border-radius:999px;display:block}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:20;
  background:rgba(16,13,11,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--faint);font-size:9px;font-weight:600;transition:color .15s}
nav button.on{color:var(--brass);font-weight:800}
nav svg{width:19px;height:19px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>

 {id:"train",title:"Training",sub:"Rotation, sets, and how to run it",icon:"dumb",color:"#f4b73f",items:[
  ["How the rotation works","Three workouts run in order — <strong>A → B → C → A</strong>. There are no assigned days. Train three times one week and five the next; you just move through the cycle faster or slower. Nothing to fall behind on."],
  ["Pick a session length on arrival","<strong>Minimum</strong> is three exercises in about 20 minutes. <strong>Short</strong> is five in about 35 and should be your default. <strong>Full</strong> is everything, for days off or when you've got energy to spare."],
  ["Short isn't a worse workout","Exercises are ordered most-important-first, so cutting a session short just trims the optional tail. The first three cover the whole muscle group on their own."],
  ["Why the set numbers differ","Compounds get 3-4 sets at 6-12 reps, where you can load heavy enough to drive growth. Isolation and cable work gets 3 sets at 10-20, since those respond better to reps than load."],

  ["Leave 1-2 reps in the tank","Stop when you could have done one or two more with good form. Training to failure every set mostly adds fatigue — the last thing you need after a long shift."],

/* ---- food search ---- */
function searchFood(query){
  var t=query.toLowerCase().trim();
  if(!t)return [];
  var toks=t.split(/\s+/),out=[];
  for(var i=0;i<FOODDB.length;i++){
    var f=FOODDB[i],nm=f[0].toLowerCase();
    var words=nm.split(/[\s,()\/]+/).filter(Boolean);
    var ok=true,sc=0;
    for(var j=0;j<toks.length;j++){
      var tk=toks[j],best=-1;
      for(var k=0;k<words.length;k++){
        var w=words[k];
        if(w===tk){best=Math.max(best,k===0?12:9);}
        else if(w.indexOf(tk)===0){best=Math.max(best,k===0?8:6);}
        else if(w.indexOf(tk)>0){best=Math.max(best,2);}
      }
      if(best<0){ok=false;break;}
      sc+=best;
    }
    if(!ok)continue;
    if(nm===t)sc+=60;
    else if(nm.indexOf(t)===0)sc+=18;
    /* prefer concise names: penalise every word beyond what was typed */
    sc-=Math.max(0,words.length-toks.length)*3;
    out.push([sc,i,f]);
  }
  out.sort(function(a,b){return b[0]-a[0]||a[1]-b[1];});
  return out.slice(0,14).map(function(x){return x[2];});
}

  recent=[f].concat(recent.filter(function(x){return x[0]!==f[0];})).slice(0,8);
  save('ledger.recent.v1',recent);
}

/* ---- food + water helpers ---- */
function dayFood(d){return food[d]||[];}
function dayCal(d){return dayFood(d).reduce(function(a,x){return a+x.c;},0);}
function dayPro(d){return dayFood(d).reduce(function(a,x){return a+x.p;},0);}
function dayWater(d){return water[d]||0;}
function addFood(n,c,p){var d=iso();food[d]=dayFood(d).concat([{n:n,c:c,p:p,t:Date.now()}]);save(K.food,food);}
function delFood(i){var d=iso(),a=dayFood(d).slice();a.splice(i,1);
  if(a.length)food[d]=a;else delete food[d];save(K.food,food);}
function addWater(oz){var d=iso();water[d]=Math.max(0,dayWater(d)+oz);
  if(water[d]===0)delete water[d];save(K.water,water);}
function sessionOn(d){for(var i=0;i<sessions.length;i++)if(sessions[i].date===d)return sessions[i];return null;}
function cycByKey(k){for(var i=0;i<CYCLE.length;i++)if(CYCLE[i].key===k)return CYCLE[i];return CYCLE[0];}

function cur(){return CYCLE[cyc.i];}
if(chk.date!==iso()||chk.key!==cur().key)chk={date:iso(),key:cur().key,items:{}};
function tierO(){for(var i=0;i<TIERS.length;i++)if(TIERS[i].id===cyc.tier)return TIERS[i];return TIERS[1];}
function actEx(){return cur().ex.slice(0,tierO().n);}
function setsFor(e){return cyc.tier==='min'?e[2]+1:e[2];}
function wid(k,e){return k+'|'+e[0];}
function getW(k,e){var v=weights[wid(k,e)];
  if(v!==undefined&&v!==null)return v;
  if(e[1]==='new'||e[1]==='—')return null;
  var n=parseFloat(e[1]);return isNaN(n)?null:n;}
function sortedLog(){return log.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});}
function last7(){var c=0,n=Date.now();sessions.forEach(function(s){
  if(n-new Date(s.date+'T00:00:00').getTime()<7*864e5)c++;});return c;}

/* ============ NEXT ============ */
function vNext(){
  var w=cur(),t=tierO(),act=actEx();
  var dn=act.filter(function(_,i){return chk.items[i];}).length;
  var pct=act.length?Math.round(dn/act.length*100):0;
  var all=dn===act.length&&act.length>0,n7=last7();
  var h='';

  h+='<section><div class="hero">'
   +'<div class="hero-top"><h2>Next up</h2>'
   +'<span class="pill" style="background:'+w.color+'1f;color:'+w.color+'">'+w.key+'</span></div>'
   +'<div class="hero-name">'+w.name+'</div><div class="hero-sub">'+w.focus+'</div>'
   +'<div class="cycle">'
   + CYCLE.map(function(c,i){
       return '<span class="st"'+(i===cyc.i?' style="background:'+c.color+';color:#100d0b"':'')+'>'+c.key+'</span>';
     }).join('<span class="ar">›</span>')
   +'</div>'
   +'<div class="meta"><b class="num">'+n7+'</b> session'+(n7===1?'':'s')+' in the last 7 days</div>'
   +'</div>'
   +'<div class="tiers">'
   + TIERS.map(function(x){return '<button data-tier="'+x.id+'" class="'+(x.id===cyc.tier?'on':'')+'">'
       +'<b>'+x.label+'</b><span>'+x.time+'</span></button>';}).join('')
   +'</div></section>';

  h+='<section><div class="sec-h"><h2>'+dn+' of '+act.length+' done</h2>'
   +(dn?'<button data-act="reset" class="tagr" style="min-height:30px;display:flex;align-items:center;gap:5px;padding:0 9px"><span style="width:11px;height:11px;display:block">'+svg(I.undo)+'</span>Reset</button>':'')
   +'</div><div style="padding:0 16px 12px"><div class="prog"><i style="width:'+pct+'%;background:'+w.color+'"></i></div></div>'
   +'<div class="divide">';
  act.forEach(function(e,i){
    var on=!!chk.items[i],st=setsFor(e),id=wid(w.key,e),wv=getW(w.key,e),ed=editing===id;
    h+='<div><div class="ex '+(on?'done':'')+'">'
      +'<button class="tick" data-act="tog" data-i="'+i+'">'
      +'<span class="box"'+(on?' style="background:'+w.color+';border-color:'+w.color+'"':'')+'>'
      +(on?'<span style="color:#100d0b;display:block;width:13px;height:13px">'+svg(I.check,3)+'</span>':'')+'</span>'
      +'<span class="exn"><span class="t">'+esc(e[0])+'</span>'
      +'<span class="m num">'+st+' × '+e[3]+'</span></span></button>'
      +'<button class="wbtn'+(wv===null?' unset':'')+'" data-act="edit" data-id="'+encodeURIComponent(id)+'"'
      +(ed?' style="border-color:'+w.color+'"':'')+'>'
      +'<span class="v">'+(wv===null?'set':wv)+'</span><span class="u">'+(wv===null?'weight':'lb')+'</span></button>'
      +'</div>'+(ed?wEditor(id,wv,w.color):'')+'</div>';
  });
  if(t.n<w.ex.length){
    w.ex.slice(t.n).forEach(function(e){
      h+='<div class="ex off"><span class="box"></span>'
        +'<span class="exn"><span class="t">'+esc(e[0])+'</span>'
        +'<span class="m num">'+e[2]+' × '+e[3]+'</span></span>'
        +'<span class="tagr">skipped</span></div>';
    });
  }
  h+='</div></section>';

  h+='<button class="btn '+(cheer?'ok':all?'go':'')+'" id="finish">'
   + svg(I.check,3)+(cheer?'Logged — '+w.name+' done':'Finish session')+'</button>'
   +'<button class="btn ghost" id="skip">Swap to '+CYCLE[(cyc.i+1)%3].name+' — don\'t log this</button>';

  if(sessions.length){
    h+='<section><div class="sec-h"><h2>Recent sessions</h2></div><div class="divide">'
     + sessions.slice(-6).reverse().map(function(s){
        var c=CYCLE.filter(function(x){return x.key===s.key;})[0]||CYCLE[0];
        return '<div class="r"><span class="l"><b style="color:'+c.color+'">'+s.key+'</b> '+c.name+'</span>'
          +'<span class="v num">'+fmtD(s.date)+' · '+s.tier+'</span></div>';}).join('')
     +'</div></section>';
  }
  return h;
}
function wEditor(id,v,color){
  return '<div class="wed">'
   +'<button class="st" data-act="nudge" data-k="'+encodeURIComponent(id)+'" data-d="-5">−5</button>'
   +'<button class="st" data-act="nudge" data-k="'+encodeURIComponent(id)+'" data-d="-2.5">−2.5</button>'
   +'<input type="number" inputmode="decimal" id="wed" value="'+(v===null?'':v)+'" placeholder="lb">'
   +'<button class="st" data-act="nudge" data-k="'+encodeURIComponent(id)+'" data-d="2.5">+2.5</button>'

/* ============ FOOD & WATER ============ */
function ringBar(label,used,goal,color,unit){
  var pct=Math.min(100,Math.round(used/goal*100));
  var left=goal-used;
  return '<div style="margin-bottom:14px">'
   +'<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">'
   +'<span class="xs" style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">'+label+'</span>'
   +'<span class="num" style="font-size:12px;color:'+(left<0?'var(--danger)':'var(--dim)')+'">'
   +(left<0?Math.abs(left)+' '+unit+' over':left+' '+unit+' left')+'</span></div>'
   +'<div class="prog" style="height:7px"><i style="width:'+pct+'%;background:'+color+'"></i></div>'
   +'<div class="num" style="font-size:19px;font-weight:900;margin-top:7px">'+used
   +'<span style="font-size:11px;font-weight:500;color:var(--faint)"> / '+goal+' '+unit+'</span></div>'
   +'</div>';
}

  return '<div class="fres">'
   +'<div class="fr-top"><span class="fr-n">'+esc(n)+'</span>'
   +(tagTxt?'<span class="tagr">'+tagTxt+'</span>':'')+'</div>'
   +'<div class="fr-bot">'
   +'<span class="fr-m num">'+cal+' kcal · '+pro+'g · '+(sv===1?f[3]:sv+' × '+f[3])+'</span>'
   +'<span class="fr-act">'
   +'<button class="sv" data-serv="'+enc+'" data-d="-1">−</button>'
   +'<span class="svn num">'+(sv%1?sv.toFixed(1):sv)+'</span>'
   +'<button class="sv" data-serv="'+enc+'" data-d="1">+</button>'
   +'<button class="fadd" data-pick="'+enc+'">'+svg(I.plus,2.8)+'</button>'
   +'</span></div></div>';
}
function resultsHTML(){
  if(!q){
    if(!recent.length)return '<p class="xs" style="color:var(--faint);margin-top:10px;line-height:1.5">'
      +'Type a food name and the calories and protein fill in automatically. Adjust servings with − / + before adding.</p>';
    return '<div class="reclist"><span class="xs" style="color:var(--faint);font-weight:700;display:block;margin:12px 0 2px">RECENT</span>'
      + recent.map(function(f){return foodCard(f,'');}).join('')+'</div>';
  }
  var r=searchFood(q);
  if(!r.length)return '<p class="xs" style="color:var(--faint);margin-top:12px;line-height:1.5">'
    +'No match. Use Manual entry below and it will still count toward today.</p>';
  return '<div class="reclist">'+r.map(function(f){return foodCard(f,'');}).join('')+'</div>';
}

/* ============ CALENDAR ============ */
function vMonth(){
  var y=mView.y,m=mView.m;
  var first=new Date(y,m,1),start=first.getDay();
  var days=new Date(y,m+1,0).getDate();
  var label=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  var todayS=iso();

  var h='<section><div class="mhead">'
   +'<button class="mnav" data-mo="-1">'+svg(I.left)+'</button>'
   +'<span style="font-weight:800;font-size:15px">'+label+'</span>'
   +'<button class="mnav" data-mo="1">'+svg(I.right)+'</button></div>'
   +'<div class="dow">'+['S','M','T','W','T','F','S'].map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>'
   +'<div class="grid">';
  for(var i=0;i<start;i++)h+='<span class="cell empty"></span>';
  for(var dnum=1;dnum<=days;dnum++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dnum).padStart(2,'0');
    var ses=sessionOn(ds),c=dayCal(ds),w=dayWater(ds);
    var isToday=ds===todayS,isSel=selDay===ds;
    var col=ses?cycByKey(ses.key).color:null;
    h+='<button class="cell'+(isToday?' today':'')+(isSel?' sel':'')+'" data-day="'+ds+'">'
     +'<span class="dn">'+dnum+'</span>'
     +'<span class="marks">'
     +(col?'<i class="wk" style="background:'+col+'"></i>':'')
     +(c>0?'<i class="fd"></i>':'')
     +(w>=TARGET.water?'<i class="wt"></i>':'')
     +'</span></button>';
  }
  h+='</div>'
   +'<div class="legend">'
   +'<span><i class="wk" style="background:var(--brass)"></i>workout</span>'
   +'<span><i class="fd"></i>food logged</span>'
   +'<span><i class="wt"></i>water goal</span>'
   +'</div></section>';

  /* month summary */
  var sesCount=0,calDays=0,calSum=0;
  sessions.forEach(function(s2){
    var d2=new Date(s2.date+'T00:00:00');
    if(d2.getFullYear()===y&&d2.getMonth()===m)sesCount++;});
  Object.keys(food).forEach(function(k2){
    var d3=new Date(k2+'T00:00:00');
    if(d3.getFullYear()===y&&d3.getMonth()===m){calDays++;calSum+=dayCal(k2);}});
  h+='<div class="g2">'
   +'<section class="stat"><span class="k">'+svg(I.dumb)+'<span class="xs" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Sessions</span></span>'
   +'<div class="n num">'+sesCount+'</div><div class="d" style="color:var(--faint)">this month</div></section>'
   +'<section class="stat"><span class="k">'+svg(I.flame)+'<span class="xs" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Avg intake</span></span>'
   +'<div class="n num">'+(calDays?Math.round(calSum/calDays):'—')+'</div>'
   +'<div class="d" style="color:var(--faint)">'+(calDays?'over '+calDays+' logged days':'no days logged')+'</div></section>'
   +'</div>';

  /* selected day detail */
  if(selDay){
    var ses2=sessionOn(selDay),it=dayFood(selDay);
    var cc=dayCal(selDay),pp=dayPro(selDay),ww=dayWater(selDay);
    h+='<section><div class="sec-h"><h2>'+new Date(selDay+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</h2>'
     +'<button class="tagr" data-day="'+selDay+'" style="min-height:28px;padding:0 8px;display:flex;align-items:center">close</button></div>'
     +'<div class="divide">';
    if(ses2){var cw=cycByKey(ses2.key);
      h+='<div class="r"><span class="l"><b style="color:'+cw.color+'">'+ses2.key+'</b> '+cw.name+'</span>'
       +'<span class="v">'+ses2.tier+' session</span></div>';
    } else {
      h+='<div class="r"><span class="l" style="color:var(--faint)">No workout logged</span></div>';
    }
    h+='<div class="r"><span class="l">Intake</span><span class="v num">'
     +(it.length?cc+' kcal · '+pp+'g protein':'—')+'</span></div>'
     +'<div class="r"><span class="l">Water</span><span class="v num">'+(ww?ww+' oz':'—')+'</span></div>';
    if(it.length){
      h+= it.map(function(x){
        return '<div class="r"><span class="l s" style="color:var(--dim)">'+esc(x.n)+'</span>'
         +'<span class="v num">'+x.c+' kcal</span></div>';}).join('');
    }
    h+='</div></section>';
  } else {
    h+='<div class="r xs" style="color:var(--faint);padding:4px 4px 0">Tap any day to see what you did and ate.</div>';
  }
  return h;
}

/* ============ WEIGHT ============ */
function vWeight(){
  var s=sortedLog(),vis=range==='all'?s:s.slice(-range);
  var lo=vis.length?Math.min.apply(null,vis.map(function(e){return e.weight;})):0;
  var hi=vis.length?Math.max.apply(null,vis.map(function(e){return e.weight;})):0;
  var last=s[s.length-1],prev=s[s.length-2];
  var d=last&&prev?+(last.weight-prev.weight).toFixed(1):0;

  var h='<div class="g2">'
   +'<section class="stat"><span class="k">'+svg(I[d<=0?'down':'up'])+'<span class="xs" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Latest</span></span>'
   +'<div class="n num">'+(last?last.weight:'—')+'<em>lbs</em></div>'
   +(prev?'<div class="d num" style="color:'+(d>0?'var(--danger)':'var(--pine)')+'">'+(d>0?'+':'')+d+' vs prior</div>':'')
   +'</section>'
   +'<section class="stat"><span class="k">'+svg(I.act)+'<span class="xs" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Target</span></span>'
   +'<div class="n num">175-185</div><div class="d" style="color:var(--faint)">hold, don\'t drop</div></section>'
   +'</div>';

  h+='<section><div class="sec-h"><h2>Trend</h2></div><div class="segs">'
   +[[6,'6M'],[12,'1Y'],[36,'3Y'],['all','All']].map(function(r){
      return '<button data-range="'+r[0]+'" class="'+(String(range)===String(r[0])?'on':'')+'">'+r[1]+'</button>';}).join('')
   +'</div><div class="mini"><span>'+vis.length+' entries</span>'
   +'<span>Low <b style="color:var(--pine)">'+lo+'</b></span>'
   +'<span>High <b style="color:var(--danger)">'+hi+'</b></span></div>'
   +'<div style="padding:0 10px 14px"><div class="chart" id="chart"></div></div></section>';

  h+='<section><div class="sec-h"><h2>Add entry</h2></div><div class="pad pt0">'
   +'<div style="display:flex;gap:8px">'
   +'<input class="wed-in" type="date" id="d" value="'+iso()+'" '
   +'style="flex:1;min-height:48px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:16px;padding:0 12px">'
   +'<input type="number" inputmode="decimal" id="w" placeholder="lbs" '
   +'style="width:78px;min-height:48px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:16px;text-align:center;font-weight:700">'
   +'</div><button class="btn '+(saved?'ok':'go')+'" id="add" style="margin-top:10px">'
   +svg(saved?I.check:I.plus,saved?3:2)+(saved?'Saved':'Log weight')+'</button></div></section>';

  h+='<section><div class="sec-h"><h2>Full log</h2></div><div class="scroll divide">'
   + s.slice().reverse().map(function(e){
      return '<div class="r"><span class="l s" style="color:var(--dim)">'+fmtM(e.date)+'</span>'
       +'<span class="v num" style="font-weight:800;font-size:15px;color:var(--text)">'+e.weight+' lbs</span></div>';}).join('')
   +'</div></section>';
  return h;
}

/* ============ TIPS ============ */
function vTips(){
  return TIPS.map(function(g){
    var open=openT===g.id;
    var s='<section><button class="acc" data-t="'+g.id+'">'
     +'<span class="lft"><span class="ic" style="background:'+g.color+'1c;color:'+g.color+'">'+svg(I[g.icon])+'</span>'
     +'<span><span style="display:block;font-weight:800;font-size:15px">'+g.title+'</span>'
     +'<span class="xs" style="color:var(--faint)">'+g.sub+'</span></span></span>'
     +'<span class="chev'+(open?' open':'')+'">'+svg(I.chev)+'</span></button>';
    if(open){
      s+='<div class="body" style="border-top:1px solid var(--line);padding-top:15px">'
       + g.items.map(function(it,i){
           return '<div class="tip'+(i===0?' key':'')+'"><h3>'+it[0]+'</h3><p>'+it[1]+'</p></div>';
         }).join('')
       +'</div>';
    }
    return s+'</section>';
  }).join('');
}

/* ============ CHART ============ */
function chart(){
  var box=document.getElementById('chart');if(!box)return;
  var s=sortedLog(),data=range==='all'?s:s.slice(-range);
  if(data.length<2){box.innerHTML='<p class="s dim">Not enough entries yet.</p>';return;}
  var W=box.clientWidth||320,H=190,PL=28,PR=4,PT=8,PB=20,iw=W-PL-PR,ih=H-PT-PB;
  var ws=data.map(function(e){return e.weight;});
  var lo=Math.min.apply(null,ws)-3,hi=Math.max.apply(null,ws)+3;
  if(hi===lo){hi+=1;lo-=1;}
  var X=function(i){return PL+(data.length===1?iw/2:i/(data.length-1)*iw);};
  var Y=function(v){return PT+(hi-v)/(hi-lo)*ih;};
  var g='';
  for(var t=0;t<=4;t++){var v=lo+(hi-lo)*t/4,y=Y(v);
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="rgba(255,232,205,.06)"/>'
      +'<text x="'+(PL-6)+'" y="'+(y+3)+'" fill="#7a6a58" font-size="9" text-anchor="end">'+Math.round(v)+'</text>';}
  /* target band 175-185 */
  if(hi>175&&lo<185){
    var yTop=Y(Math.min(185,hi)),yBot=Y(Math.max(175,lo));
    g+='<rect x="'+PL+'" y="'+yTop+'" width="'+iw+'" height="'+Math.max(0,yBot-yTop)+'" fill="#f0c04a" opacity=".07"/>';
  }
  var step=Math.max(1,Math.ceil(data.length/5));
  for(var i=0;i<data.length;i+=step)
    g+='<text x="'+X(i)+'" y="'+(H-5)+'" fill="#7a6a58" font-size="9" text-anchor="middle">'+fmtM(data[i].date)+'</text>';
  var pts=data.map(function(e,i){return X(i)+','+Y(e.weight);}).join(' ');
  var area='M'+X(0)+','+(H-PB)+' L'+pts.split(' ').join(' L')+' L'+X(data.length-1)+','+(H-PB)+' Z';
  var dots='';
  if(data.length<=20)data.forEach(function(e,i){dots+='<circle cx="'+X(i)+'" cy="'+Y(e.weight)+'" r="2.5" fill="#e8933c"/>';});
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
   +'<defs><linearGradient id="fd" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#e8933c" stop-opacity=".16"/>'
   +'<stop offset="1" stop-color="#e8933c" stop-opacity="0"/></linearGradient></defs>'
   +g+'<path d="'+area+'" fill="url(#fd)"/>'
   +'<polyline points="'+pts+'" fill="none" stroke="#e8933c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
   +dots+'<circle id="cur" r="5.5" fill="#e8933c" opacity="0"/></svg><div class="tip-c" id="tc"></div>';
  var tc=document.getElementById('tc'),cu=document.getElementById('cur');
  function at(cx){var r=box.getBoundingClientRect(),px=(cx-r.left)/r.width*W;
    var idx=Math.max(0,Math.min(data.length-1,Math.round((px-PL)/(iw||1)*(data.length-1))));
    var e=data[idx],x=X(idx),y=Y(e.weight);
    cu.setAttribute('cx',x);cu.setAttribute('cy',y);cu.setAttribute('opacity','1');
    tc.innerHTML=fmtM(e.date)+' · <b>'+e.weight+' lbs</b>';
    tc.style.left=(x/W*100)+'%';tc.style.top=(y/H*100)+'%';tc.classList.add('on');}
  function off(){cu.setAttribute('opacity','0');tc.classList.remove('on');}
  box.addEventListener('touchstart',function(e){at(e.touches[0].clientX);},{passive:true});
  box.addEventListener('touchmove',function(e){at(e.touches[0].clientX);},{passive:true});
  box.addEventListener('touchend',off);
  box.addEventListener('mousemove',function(e){at(e.clientX);});
  box.addEventListener('mouseleave',off);
}

/* ============ RENDER ============ */
var view=document.getElementById('view'),nav=document.getElementById('nav'),crumb=document.getElementById('crumb');
function paintResults(){var box=document.getElementById('sres');if(box)box.innerHTML=resultsHTML();}
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){q=e.target.value;qServ={};paintResults();}
});
function render(){
  view.innerHTML=[vNext,vTrain,vFood,vMonth,vWeight,vTips][tab]();
  crumb.innerHTML=CRUMB[tab];
  nav.innerHTML=TABS.map(function(t,i){
    return '<button data-tab="'+i+'" class="'+(tab===i?'on':'')+'">'+svg(I[t[1]],tab===i?2.3:1.8)+'<span>'+t[0]+'</span></button>';
  }).join('');
  if(tab===4)chart();
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-act],[data-w],[data-t],[data-tier],[data-range],[data-water],[data-ice],[data-pick],[data-serv],[data-clr],[data-del],[data-q],[data-cat],[data-add],[data-day],[data-mo],#add,#finish,#skip,#fadd');
  if(!t)return;
  if(t.id==='finish'){buzz(15);
    sessions=sessions.concat([{date:iso(),key:cur().key,tier:tierO().label}]);save(K.ses,sessions);
    cyc.i=(cyc.i+1)%CYCLE.length;save(K.cyc,cyc);
    chk={date:iso(),key:cur().key,items:{}};save(K.chk,chk);
    editing=null;cheer=true;render();
    setTimeout(function(){cheer=false;if(tab===0)render();},1800);return;}
  if(t.id==='skip'){buzz(12);
    cyc.i=(cyc.i+1)%CYCLE.length;save(K.cyc,cyc);
    chk={date:iso(),key:cur().key,items:{}};save(K.chk,chk);editing=null;render();return;}
  if(t.id==='add'){
    var dE=document.getElementById('d'),wE=document.getElementById('w'),v=parseFloat(wE.value);
    if(!dE.value||isNaN(v))return;buzz(12);
    log=log.filter(function(e){return e.date!==dE.value;}).concat([{date:dE.value,weight:v}]);
    save(K.log,log);saved=true;render();
    setTimeout(function(){saved=false;if(tab===4)render();},1600);return;}
  if(t.dataset.pick!==undefined){buzz(12);
    var pn=decodeURIComponent(t.dataset.pick),pf=null;
    for(var pi=0;pi<FOODDB.length;pi++)if(FOODDB[pi][0]===pn){pf=FOODDB[pi];break;}
    if(!pf)for(var ri=0;ri<recent.length;ri++)if(recent[ri][0]===pn){pf=recent[ri];break;}
    if(!pf)return;
    var mult=servOf(pn);
    addFood(mult===1?pf[0]:pf[0]+' x'+(mult%1?mult.toFixed(1):mult),
            Math.round(pf[1]*mult),Math.round(pf[2]*mult));
    pushRecent(pf);delete qServ[pn];render();return;}
  if(t.dataset.serv!==undefined){buzz();
    var sn=decodeURIComponent(t.dataset.serv),dd=parseFloat(t.dataset.d);
    var cvv=servOf(sn);
    var nv=dd>0?(cvv<1?cvv+0.5:cvv+1):(cvv<=1?cvv-0.5:cvv-1);
    nv=Math.round(Math.max(0.5,Math.min(10,nv))*10)/10;
    qServ[sn]=nv;paintResults();return;}
  if(t.dataset.clr!==undefined){buzz();q='';qServ={};render();
    var qb=document.getElementById('q');if(qb)qb.focus();return;}
  if(t.dataset.ice!==undefined){buzz();ice=!ice;save('ledger.ice.v1',ice);render();return;}
  if(t.dataset.water!==undefined){buzz();addWater(parseInt(t.dataset.water,10));render();return;}
  if(t.dataset.del!==undefined){buzz(12);delFood(parseInt(t.dataset.del,10));render();return;}
  if(t.dataset.q!==undefined){buzz(12);
    var q=decodeURIComponent(t.dataset.q).split('|');
    addFood(q[0],parseInt(q[1],10),parseInt(q[2],10));render();return;}
  if(t.dataset.cat!==undefined){buzz();var cn=decodeURIComponent(t.dataset.cat);
    openCat=openCat===cn?null:cn;render();return;}
  if(t.dataset.add!==undefined){buzz();addOpen=!addOpen;render();
    var fn=document.getElementById('fn');if(fn)fn.focus();return;}
  if(t.id==='fadd'){
    var nEl=document.getElementById('fn'),cEl=document.getElementById('fc'),pEl=document.getElementById('fp');
    var nm=(nEl.value||'').trim(),cv=parseInt(cEl.value,10),pv=parseInt(pEl.value,10);
    if(!nm||isNaN(cv))return;
    buzz(12);addFood(nm,cv,isNaN(pv)?0:pv);addOpen=false;render();return;}
  if(t.dataset.mo!==undefined){buzz();
    var mm=mView.m+parseInt(t.dataset.mo,10),yy=mView.y;
    if(mm<0){mm=11;yy--;}if(mm>11){mm=0;yy++;}
    mView={y:yy,m:mm};selDay=null;render();return;}
  if(t.dataset.day!==undefined){buzz();
    selDay=selDay===t.dataset.day?null:t.dataset.day;render();return;}
  if(t.dataset.act==='edit'){buzz();var id=decodeURIComponent(t.dataset.id);
    editing=editing===id?null:id;render();
    var f=document.getElementById('wed');if(f){f.focus();f.select();}return;}
  if(t.dataset.act==='nudge'){buzz();
    var k=decodeURIComponent(t.dataset.k),d=parseFloat(t.dataset.d),f2=document.getElementById('wed');
    var b=f2&&f2.value!==''?parseFloat(f2.value):(weights[k]!==undefined?weights[k]:0);
    if(isNaN(b))b=0;
    weights[k]=Math.max(0,Math.round((b+d)*10)/10);save(K.wt,weights);render();return;}
  if(t.dataset.act==='wdone'){buzz(12);
    var k3=decodeURIComponent(t.dataset.k),f3=document.getElementById('wed');
    var v3=f3&&f3.value!==''?parseFloat(f3.value):NaN;
    if(isNaN(v3)||v3<=0)delete weights[k3];else weights[k3]=Math.round(v3*10)/10;
    save(K.wt,weights);editing=null;render();return;}
  if(t.dataset.act==='tog'){buzz();chk.items[t.dataset.i]=!chk.items[t.dataset.i];
    chk.date=iso();save(K.chk,chk);render();return;}
  if(t.dataset.act==='reset'){buzz(12);chk={date:iso(),key:cur().key,items:{}};save(K.chk,chk);render();return;}
  if(t.dataset.tier){buzz();cyc.tier=t.dataset.tier;save(K.cyc,cyc);editing=null;render();return;}
  if(t.dataset.range!==undefined){buzz();range=t.dataset.range==='all'?'all':+t.dataset.range;render();return;}
  if(t.dataset.w){buzz();openW=openW===t.dataset.w?null:t.dataset.w;render();return;}
  if(t.dataset.t){buzz();openT=openT===t.dataset.t?null:t.dataset.t;render();
    window.scrollTo({top:window.scrollY,behavior:'auto'});return;}
  if(t.dataset.tab!==undefined){buzz();tab=+t.dataset.tab;editing=null;window.scrollTo(0,0);render();}
});
var sx=null,sy=null;
document.addEventListener('touchstart',function(e){
  if(e.target.closest('.chart')){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  if(sx===null)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){
    if(dx<0&&tab<5){buzz();tab++;window.scrollTo(0,0);render();}
    if(dx>0&&tab>0){buzz();tab--;window.scrollTo(0,0);render();}}
  sx=null;});
window.addEventListener('resize',function(){if(tab===4)chart();});
render();
</script>
